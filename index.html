<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<script>
// 自动更新：每次部署须同步 PAGE_VER（下方 APP_VER）与仓库根目录的 version.txt。
// 原理：加载后静默拉取 version.txt（带防缓存参数，每次都拿最新），若线上版本号与
// 内置 PAGE_VER 不同，则强制重新加载当前页（一次性时间戳参数，绕过任何缓存拿到最新
// index.html）；加载后清掉临时参数，地址栏保持干净。这样“直接输网址”也会自动更新。
(function(){
  try{
    var PAGE_VER='2026-08-17t';
    if(location.search.indexOf('_=')>=0){ history.replaceState(null,'',location.pathname); }
    function check(){
      fetch('version.txt?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.text();}).then(function(t){
        var v=(t||'').trim();
        if(v && v!==PAGE_VER){ location.replace(location.pathname+'?_='+Date.now()); }
      }).catch(function(){});
    }
    setTimeout(check, 1000);
    setInterval(check, 120000); // 每 2 分钟静默核对一次，已开着的标签页也能自动更新
  }catch(e){}
})();
</script>
<title>AI 创作库 · Vault Studio</title>
<style>
  :root{
    --bg:#0d0d0f; --bg2:#141417; --panel:#1a1a1f; --panel2:#202027;
    --border:#2a2a32; --border-acc:#ff4d6d; --accent:#ff5c8a; --accent2:#e63950;
    --text:#e8e8ea; --muted:#9a9aa2; --green:#3ddc84; --chip:#26262e;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,sans-serif;font-size:14px}
  header{position:sticky;top:0;z-index:20;background:rgba(13,13,15,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
  .nav{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:6px;padding:10px 18px}
  .brand{font-weight:700;font-size:16px;margin-right:18px;letter-spacing:.5px}
  .brand b{color:var(--accent)}
  .brand small{color:var(--muted);font-weight:400;font-size:11px;margin-left:6px}
  .tab{background:transparent;border:1px solid transparent;color:var(--muted);padding:7px 14px;border-radius:8px;cursor:pointer;font-size:13px}
  .tab:hover{color:var(--text);background:var(--panel)}
  .tab.active{color:#fff;border-color:var(--border-acc);background:linear-gradient(180deg,#2a1620,#1a1a1f);box-shadow:0 0 0 1px rgba(255,92,138,.25)}
  main{max-width:1180px;margin:0 auto;padding:20px 18px 80px}
  section[hidden]{display:none}
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
  .toolbar .spacer{flex:1}
  button.btn{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px}
  button.btn:hover{border-color:var(--accent)}
  button.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;font-weight:600}
  button.primary:hover{filter:brightness(1.08)}
  input,textarea,select{background:var(--bg2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
  input::placeholder,textarea::placeholder{color:#666}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .15s,transform .15s}
  .card:hover{border-color:var(--accent);transform:translateY(-2px)}
  .card.flash{animation:flash 1.4s ease}
  @keyframes flash{0%,100%{box-shadow:0 0 0 0 rgba(255,92,138,0)}30%{box-shadow:0 0 0 2px var(--accent)}}
  .thumb{height:150px;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden;border-bottom:1px solid var(--border)}
  .thumb img,.thumb video{max-width:100%;max-height:100%;object-fit:contain}
  .thumb .ph{color:var(--muted);font-size:12px}
  .card .body{padding:12px;display:flex;flex-direction:column;gap:8px;flex:1}
  .prompt-snippet{font-size:12px;color:#cfcfd6;line-height:1.5;max-height:72px;overflow:hidden;white-space:pre-wrap}
  .meta{font-size:11px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
  .meta a{color:var(--accent);text-decoration:none}
  .meta a:hover{text-decoration:underline}
  .tags{display:flex;flex-wrap:wrap;gap:5px}
  .tag{background:var(--chip);border:1px solid var(--border);color:var(--muted);font-size:11px;padding:2px 8px;border-radius:20px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
  .actions button{flex:1;padding:6px 8px;font-size:12px}
  .badge{display:inline-block;background:#2a1620;border:1px solid var(--accent);color:var(--accent);font-size:11px;padding:2px 8px;border-radius:6px}
  .badge.sub{border-color:var(--border);color:var(--muted);background:var(--chip);margin-left:4px}
  .block-card .body{position:relative}
  .src-link{font-size:11px;color:var(--accent);cursor:pointer}
  .src-link:hover{text-decoration:underline}
  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:30px 16px;overflow:auto}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:14px;width:min(720px,100%);padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .modal h3{margin:0 0 14px;font-size:16px}
  .modal h3 small{color:var(--muted);font-weight:400;margin-left:8px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
  .field textarea{width:100%;min-height:90px;resize:vertical}
  .paste-hint{font-size:11px;color:var(--accent);margin-top:4px}
  .decomp-row{display:grid;grid-template-columns:1fr 130px 110px 120px 30px;gap:8px;margin-bottom:10px;align-items:start}
  .decomp-cell{display:flex;flex-direction:column;gap:5px;min-width:0}
  .dec-tr{font-size:12px;color:var(--muted);background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;line-height:1.5;min-height:30px;word-break:break-word;white-space:pre-wrap}
  .dec-tr.loading{color:#777;font-style:italic;background:transparent;border-style:dashed}
  .dec-tr.empty{color:#666;font-style:italic;background:transparent;border-style:dashed}
  .tr-preview{margin-top:6px;font-size:12px;color:var(--text);background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;line-height:1.5;min-height:34px;word-break:break-word;white-space:pre-wrap}
  .tr-preview.loading{color:#777;font-style:italic}
  .tr-preview .lbl{display:block;color:var(--accent);font-size:11px;margin-bottom:4px;font-weight:600}
  .decomp-row input,.decomp-row select{padding:6px 8px;font-size:12px}
  /* 分类/标签管理弹窗 */
  .mtab{overflow-y:auto;padding-right:4px}
  .mtab::-webkit-scrollbar{width:6px}
  .mtab::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
  .cat-edit-row{display:flex;align-items:flex-start;gap:10px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:8px}
  .cat-edit-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
  .cat-name{font-size:13px;font-weight:600;padding:6px 8px;width:100%}
  .cat-subs{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .sub-chip{background:#2a2230;border:1px solid #4a2a3a;color:var(--text);font-size:12px;padding:3px 8px;border-radius:14px;display:inline-flex;align-items:center;gap:6px}
  .sub-chip .sub-x{cursor:pointer;color:var(--accent);font-weight:700}
  .sub-chip .sub-x:hover{color:var(--accent2)}
  .sub-add{font-size:12px;padding:4px 8px;width:110px}
  .cat-edit-ops{display:flex;flex-direction:column;gap:4px}
  .btn.mini{padding:3px 8px;font-size:12px;line-height:1.2}
  .tag-edit-row{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:7px 10px;margin-bottom:6px}
  .tag-edit-row .tag-name{flex:1;font-size:13px;padding:5px 8px}
  .composer{display:grid;grid-template-columns:1fr;gap:16px}
  .draft-chips{display:flex;flex-wrap:wrap;gap:6px;min-height:40px;border:1px dashed var(--border);border-radius:10px;padding:8px;align-items:flex-start;align-content:flex-start;max-height:200px;overflow-y:auto}
  .draft-chips::-webkit-scrollbar{width:6px}
  .draft-chips::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
  .chip-x{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:1px;background:var(--chip);border:1px solid var(--border);border-radius:7px;padding:3px 20px 4px 8px;font-size:11px;line-height:1.3;max-width:100%;transition:border-color .12s,background .12s}
  .chip-x:hover{border-color:var(--accent);background:#2e2e38}
  .chip-x .chip-cat{color:var(--accent);font-size:9px;letter-spacing:.4px;font-weight:600}
  .chip-x .chip-en{color:var(--text);font-size:11px;line-height:1.35;word-break:break-word;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .chip-x .chip-zh{color:var(--muted);font-size:9.5px;line-height:1.25;word-break:break-word;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .chip-x b{position:absolute;top:2px;right:6px;color:var(--accent);cursor:pointer;font-weight:700;font-size:13px;line-height:1;padding:0 2px}
  .chip-x b:hover{color:var(--accent2)}
  .assembled{width:100%;min-height:160px;font-family:ui-monospace,Menlo,Consolas,monospace;line-height:1.6}
  /* 悬浮高亮层：叠在 textarea 之上（pointer-events:none），hover 选中区块时显示对应片段 */
  .hl-wrap{position:relative;background:var(--bg2);border:1px solid #3a2030;border-radius:8px;overflow:hidden}
  .hl-wrap:focus-within{border-color:var(--accent)}
  .hl-layer{position:absolute;inset:0;overflow:hidden;pointer-events:none;padding:8px 10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-word;color:transparent;z-index:2}
  .hl-layer mark{background:rgba(255,92,138,.30);color:transparent;border-radius:3px;box-shadow:0 0 0 1px rgba(255,92,138,.55)}
  .empty{color:var(--muted);text-align:center;padding:40px;border:1px dashed var(--border);border-radius:12px}
  .stat{display:flex;gap:24px;margin-bottom:18px}
  .stat .k{font-size:22px;font-weight:700;color:var(--accent)}
  .stat .l{font-size:12px;color:var(--muted)}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#222;border:1px solid var(--accent);color:#fff;padding:10px 18px;border-radius:8px;z-index:99;opacity:0;transition:opacity .2s}
  .toast.show{opacity:1}
  .filter select,.filter input{font-size:12px}
  .danger{color:var(--accent2)}
  .blk-group{margin-bottom:26px}
  .blk-group h4{font-size:13px;color:var(--accent);margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
  .blk-group h4 .cnt{color:var(--muted);font-weight:400;font-size:11px}
  .blk-group .ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
  .tr-line{color:#ffb3c6;border-left:2px solid var(--accent);padding-left:8px;margin-top:6px;font-size:12px;line-height:1.5;white-space:pre-wrap}
  .gal-card .thumb video,.gal-card .thumb img{object-fit:cover;width:100%;height:100%}
  /* 区块库：横向滚动 + 可拖拽列 */
  .hscroll{display:flex;gap:14px;overflow-x:auto;overflow-y:hidden;padding:4px 2px 14px;align-items:stretch;scrollbar-width:thin}
  .hscroll::-webkit-scrollbar{height:10px}
  .hscroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:5px}
  .hscroll::-webkit-scrollbar-thumb:hover{background:var(--accent)}
  .blk-col{flex:0 0 280px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px;display:flex;flex-direction:column;max-height:72vh;cursor:grab;transition:border-color .15s,transform .15s}
  .blk-col:hover{border-color:var(--accent)}
  .blk-col.dragging{opacity:.4;cursor:grabbing}
  .blk-col.drag-over{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  .blk-col-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border);font-size:13px;color:var(--accent)}
  .blk-col-head .cnt{color:var(--muted);font-weight:400;font-size:11px;margin-left:auto;background:var(--chip);border:1px solid var(--border);border-radius:20px;padding:1px 8px}
  .blk-col-head .drag-hint{color:var(--muted);font-size:14px;cursor:grab;user-select:none;letter-spacing:-1px;line-height:1}
  .blk-col-head .drag-hint:hover{color:var(--accent)}
  .col-body{overflow-y:auto;display:flex;flex-direction:column;gap:12px;flex:1;padding-right:4px}
  .col-body::-webkit-scrollbar{width:6px}
  .col-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
  /* 拼装台：合并区块库的两栏布局 */
  .composer-layout{display:grid;grid-template-columns:minmax(340px,42%) 1fr;gap:18px;align-items:start}
  .composer-pane{display:flex;flex-direction:column;gap:14px;position:sticky;top:80px;max-height:calc(100vh - 100px);overflow-y:auto;padding-right:6px}
  .composer-pane::-webkit-scrollbar{width:6px}
  .composer-pane::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
  .blocks-pane{display:flex;flex-direction:column;gap:10px;min-width:0}
  /* 拼装台右上：可折叠的翻译小卡（精简版） */
  .tr-mini{border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--panel)}
  .tr-mini-head{display:flex;align-items:center;gap:8px;padding:6px 8px;border-bottom:1px solid var(--border)}
  .tr-mini-head .cat-tab{padding:4px 10px}
  .tr-mini-head select{margin-left:auto;font-size:11px;padding:3px 6px}
  .tr-mini-body{padding:8px;display:flex;flex-direction:column;gap:6px}
  .tr-mini-body textarea{min-height:32px;font-size:12px;resize:vertical;line-height:1.5}
  .tr-mini-body .row{margin:0}
  .blocks-pane-head{display:flex;align-items:center;gap:8px}
  .blocks-pane-head input{flex:1}
  .cat-tabs{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:8px;border-bottom:1px solid var(--border)}
  .cat-tab{background:var(--panel2);border:1px solid var(--border);color:var(--muted);padding:5px 11px;border-radius:20px;cursor:pointer;font-size:12px}
  .cat-tab:hover{color:var(--text);border-color:var(--accent)}
  .cat-tab.active{color:#fff;border-color:var(--border-acc);background:linear-gradient(180deg,#2a1620,#1a1a1f)}
  .cat-tab .cnt{color:var(--muted);margin-left:4px;font-size:11px}
  .cat-tab.active .cnt{color:#ffb3c6}
.blocks-list{display:flex;flex-direction:column;gap:7px;align-items:flex-start;overflow-y:auto;overflow-x:hidden;max-height:calc(100vh - 240px);padding-right:6px;padding-bottom:14px;width:100%}
.blocks-list::-webkit-scrollbar{width:6px}
.blocks-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
/* 紧凑区块卡片（关键：flex-shrink:0 让卡片不被 flex 等比压缩） */
.blk-c{padding:9px 12px;gap:6px;cursor:pointer;transition:border-color .15s,transform .1s;align-self:flex-start;width:100%;flex:0 0 auto}
.blk-c .body{flex:0 0 auto;padding:0;display:flex;flex-direction:column;gap:6px}
.blk-c.combo-c{border-color:#3a2030;background:linear-gradient(180deg,#1f1822 0%,#1a1a1f 100%);box-shadow:inset 3px 0 0 0 var(--accent)}
.blk-c.combo-c:hover{border-color:var(--accent)}
  .blk-c:hover{border-color:var(--accent)}
  .blk-c .blk-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:5px}
  .blk-c .blk-content{font-size:13px;line-height:1.55;white-space:pre-wrap;color:var(--text);word-break:break-word}
  .blk-c .tr-line{margin-top:5px;font-size:12px}
  .blk-c .blk-foot{display:flex;justify-content:space-between;align-items:center;margin-top:7px;gap:8px;flex-wrap:wrap}
  .blk-c .blk-foot .meta{font-size:11px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .blk-c .blk-foot .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:0}
  .blk-c .blk-foot .tag{font-size:10px;padding:1px 6px}
  .blk-c .blk-foot .actions{display:flex;gap:4px;margin:0;flex-shrink:0}
  .blk-c .blk-foot .actions .btn{padding:3px 9px;font-size:11px}
  .blk-c.added{animation:flash 1s ease}
  /* 收藏库缩略图可点击放大 */
  .thumb{cursor:zoom-in}
  /* 资产库 */
  .nav-sep{width:1px;height:22px;background:var(--border);margin:0 4px}
  .am-images{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
  .pal-row input,.pal-row select{background:var(--bg2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:4px}
  .asset-card .body .prompt-snippet{border:0;padding:0}
  /* 预选项：输入建议 */
  .sug{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .sug-chip{background:var(--chip);border:1px solid var(--border);color:var(--muted);font-size:11px;padding:3px 9px;border-radius:14px;cursor:pointer;user-select:none;display:inline-flex;align-items:center;gap:4px}
  .sug-chip:hover{border-color:var(--accent);color:var(--text)}
  .sug-chip.on{border-color:var(--accent);color:#fff;background:#2a1620}
  .sug-chip .chip-x{font-size:10px;opacity:.4;background:transparent;border:0;color:inherit;cursor:pointer;padding:0 0 0 2px;line-height:1}
  .sug-chip .chip-x:hover{opacity:1;color:var(--accent)}
  .sug-hint{font-size:11px;color:#777;margin-top:4px}
  /* 资产库：层级集 / 画板 / 展示视图 */
  .crumb{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .crumb-name{font-weight:600;font-size:15px}
  .crumb .meta{color:var(--muted)}
  .mood-grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
  .collection-card,.mood-card{background:var(--panel2);border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;transition:border-color .15s,transform .1s;display:flex;flex-direction:column}
  .collection-card:hover,.mood-card:hover{border-color:var(--accent);transform:translateY(-2px)}
  .m-thumb{background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:0}
  .collection-card .m-thumb{height:140px}
  .mood-card .m-thumb{height:120px}
  .thumb-toggle{position:absolute;top:6px;right:6px;z-index:3;background:rgba(20,18,26,.82);color:#fff;border:1px solid var(--border);border-radius:8px;font-size:11px;padding:3px 7px;cursor:pointer;backdrop-filter:blur(2px)}
  .thumb-toggle:hover{border-color:var(--accent)}
  .m-thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .m-thumb .ph{color:#666;font-size:12px}
  .m-body{padding:9px 10px;display:flex;flex-direction:column;gap:6px;flex:1}
  .m-badges{display:flex;gap:5px;flex-wrap:wrap}
  .m-name{font-size:13px;line-height:1.35;word-break:break-word}
  .m-sub{font-size:11px;color:#9a9aa2;line-height:1.4;max-height:30px;overflow:hidden}
  .m-body .actions{margin-top:auto;display:flex;gap:5px;flex-wrap:wrap}
  .m-body .actions .btn{padding:3px 9px;font-size:11px}
  .badge.set{background:#10221c;border-color:#3fae8e;color:#5fe3b6}
  .badge.sub{background:#1c1430;border-color:#7c5cff;color:#b9a6ff}
  /* 列表行（集内视图：每个子资产一行） */
  .list-grid{display:flex;flex-direction:column;gap:5px;margin-top:8px}
  .asset-row{display:flex;align-items:stretch;background:var(--panel2);border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:grab;transition:border-color .15s,transform .1s}

<script>
/* ============ 分类体系（可编辑，持久化在 meta.categories） ============ */
const DEFAULT_CATEGORIES = [
  {id:'booster', name:'起手式', subs:['通用增强','写实增强','动漫增强','画质分辨率']},
  {id:'style', name:'风格', subs:['艺术风格','媒介介质','参考作者','色调']},
  {id:'character', name:'人设', subs:['外貌基础','发型','面部妆容','服装','气质姿态','身份背景']},
  {id:'scene', name:'场景', subs:['地点','时间','天气','氛围','背景细节']},
  {id:'subject', name:'内容主体', subs:['主体','动作','物件','互动']},
  {id:'composition', name:'构图与镜头', subs:['景别','角度','镜头焦段','光线','构图']},
  {id:'positive', name:'正面提示词', subs:['主体描述','整体氛围','通用']},
  {id:'negative', name:'负面提示词', subs:['通用负面','画质负面','内容负面']},
  {id:'general', name:'综合', subs:['其他','待分类']},
  {id:'video', name:'视频动态', subs:['运动描述','运镜','时长转场','视频负面','电影感']},
  {id:'combo', name:'组合', subs:[]},
];
let CATEGORIES = DEFAULT_CATEGORIES;
const catName = id => (CATEGORIES.find(c=>c.id===id)||{}).name || id;
const catSubs = id => (CATEGORIES.find(c=>c.id===id)||{}).subs || [];
// 拼装智能排序（新增分类追加到末尾，删除分类时同步移除）
const SORT_ORDER = ['booster','style','character','scene','subject','composition','positive','negative','general','video'];
async function loadCategories(){
  const d=await getOne('meta','categories');
  if(d && Array.isArray(d.value) && d.value.length){ CATEGORIES=d.value.map(c=>({id:c.id,name:c.name,subs:[...(c.subs||[])]})); }
  else { CATEGORIES=JSON.parse(JSON.stringify(DEFAULT_CATEGORIES)); await saveCategories(); }
}
async function saveCategories(){ await putOne('meta',{id:'categories',value:CATEGORIES}); }
function syncSortOrder(){
  const ids=new Set(CATEGORIES.map(c=>c.id));
  CATEGORIES.forEach(c=>{ if(!SORT_ORDER.includes(c.id)) SORT_ORDER.push(c.id); });
  for(let i=SORT_ORDER.length-1;i>=0;i--){ if(!ids.has(SORT_ORDER[i])) SORT_ORDER.splice(i,1); }
}

/* ============ 数据库 ============ */
const DB_NAME='promptvault', DB_VER=2, APP_VER='2026-08-17t';
let db, dbReady;
function openDB(){
  if(dbReady) return dbReady;
  dbReady = new Promise((res,rej)=>{
    if(typeof indexedDB==='undefined'){ rej(new Error('当前浏览器不支持本地数据库（IndexedDB）')); return; }
    let r; try { r = indexedDB.open(DB_NAME, DB_VER); } catch(e){ rej(e); return; }
    r.onupgradeneeded = e=>{
      const d = e.target.result;
      ['captures','blocks','meta','assets','projects'].forEach(s=>{
        if(!d.objectStoreNames.contains(s)) d.createObjectStore(s,{keyPath:'id'});
      });
    };
    r.onsuccess = e=>{ db=e.target.result; res(); };
    r.onerror   = e=>{ rej(e.target.error || new Error('数据库打开失败')); };
    r.onblocked = ()=>{ rej(new Error('DB_BLOCKED')); };
  });
  return dbReady;
}
// 数据库被其他标签页占用导致打开失败时，重置后允许重试
function reopenDB(){ dbReady=null; db=null; return openDB(); }
// 任意 DB 操作都先等数据库真正就绪，避免 db 为 undefined 时读到 transaction 报错
async function st(name,mode){ await dbReady; if(!db) throw new Error('数据库尚未就绪，请刷新页面'); return db.transaction(name,mode).objectStore(name); }
async function getAll(name){ const s=await st(name,'readonly'); return new Promise((res,rej)=>{const r=s.getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error);}); }
async function getOne(name,key){ const s=await st(name,'readonly'); return new Promise((res,rej)=>{const r=s.get(key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}); }
async function putOne(name,v){ const s=await st(name,'readwrite'); return new Promise((res,rej)=>{const r=s.put(v);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);}); }
async function delOne(name,key){ const s=await st(name,'readwrite'); return new Promise((res,rej)=>{const r=s.delete(key);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);}); }
// 脚本加载即开始打开数据库，确保之后任意时刻调用都有 dbReady 可等待
dbReady = openDB();
console.log('[VaultStudio]', APP_VER);
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);

/* ============ 状态 ============ */
const state = { view:'captures', highlightId:null, draft:[], activeCat:'all', blkSearch:'', assetProject:'', assetCat:'all', assetParent:'', assetCollection:'', assetSort:'order' };
let mediaUrls = [];
let composerMap = {};
function revokeMedia(){ mediaUrls.forEach(u=>URL.revokeObjectURL(u)); mediaUrls=[]; }

/* ============ 工具 ============ */
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1600);}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
// 提取英文：content / translation 谁是不含中文的就选谁（不预设哪个是英文）
function pickEN(b){
  const c=(b.content||'').trim(), t=(b.translation||'').trim();
  const cEN = c && !/[一-鿿]/.test(c);
  const tEN = t && !/[一-鿿]/.test(t);
  if(cEN) return c;
  if(tEN) return t;
  return c || t; // 实在没有英文，退而求其次用原文
}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('已复制 ✓');}catch(e){toast('复制失败，请手动选择');}}

/* ============ 渲染：收藏库 ============ */
async function renderCaptures(){
  revokeMedia();
  const grid=document.getElementById('capture-grid');
  let caps=await getAll('captures');
  const q=(document.getElementById('cap-search').value||'').toLowerCase();
  const tp=document.getElementById('cap-type').value;
  caps=caps.filter(c=>{
    if(c.galleryOnly) return false;
    if(tp && (c.media?c.media.type:'none')!==tp) return false;
    if(q){const hay=((c.rawPrompt||'')+' '+(c.tags||[]).join(' ')+' '+(c.sourceUrl||'')).toLowerCase();if(!hay.includes(q))return false;}
    return true;
  });
  caps.sort((a,b)=>b.createdAt-a.createdAt);
  document.getElementById('cap-count').textContent=`共 ${caps.length} 条`;
  if(!caps.length){grid.innerHTML='<div class="empty">还没有收藏。点「＋ 新增收藏」粘贴图片/视频和提示词吧。</div>';return;}
  grid.innerHTML = caps.map(c=>{
    let media='<div class="ph">无媒体</div>';
    if(c.media){const u=URL.createObjectURL(c.media.blob);mediaUrls.push(u);
      media = c.media.type==='video' ? `<video src="${u}" muted loop controls></video>` : `<img src="${u}" alt="">`;}
    const src=c.sourceUrl?`<a href="${esc(c.sourceUrl)}" target="_blank" rel="noopener">来源 ↗</a>`:'';
    const tags=(c.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('');

async function renderComposer(){
  const blocks=await getAll('blocks');
  const map=Object.fromEntries(blocks.map(b=>[b.id,b]));
  composerMap=map;
  clearHighlight();
  const chips=document.getElementById('draft-chips');
  if(!state.draft.length){chips.innerHTML='<span class="meta">从右侧点区块一键加入，或点 × 移除…</span>';}
  else chips.innerHTML=state.draft.map(id=>{const b=map[id];if(!b)return'';
    return `<span class="chip-x" data-id="${id}" title="${esc((b.content||'')+'\n'+(b.translation||''))}">
      <span class="chip-cat">${esc(catName(b.category))}</span>
      <span class="chip-en">${esc(b.content||'')}</span>
      ${b.translation?`<span class="chip-zh">${esc(b.translation)}</span>`:''}
      <b data-rm="${id}" title="移除">×</b>
    </span>`;}).join('');
  // 鼠标悬停已选区块 → 在对应 textarea 高亮该段
  chips.querySelectorAll('.chip-x').forEach(ch=>{
    ch.addEventListener('mouseenter',()=>highlightBlock(ch.dataset.id));
    ch.addEventListener('mouseleave',clearHighlight);
  });
  refreshAssembled(map);
  document.getElementById('composer-count').textContent=`已选 ${state.draft.length} 个区块`;
  await renderBlocksPane();
}
function refreshAssembled(map){
  map=map||composerMap;
  const blocks=state.draft.map(id=>map[id]).filter(Boolean);
  const order=b=>{const i=SORT_ORDER.indexOf(b.category);return i<0?99:i;};
  const positive=blocks.filter(b=>b.category!=='negative').sort((a,b)=>order(a)-order(b)).map(pickEN).filter(Boolean).join(', ');
  const negative=blocks.filter(b=>b.category==='negative').map(pickEN).filter(Boolean).join(', ');
  const a=document.getElementById('assembled'), n=document.getElementById('assembled-neg');
  a.value=positive; n.value=negative;
  // 内容变长时自动增高（无字数上限，最多到 360/200px 后内部滚动）
  a.style.height='auto'; a.style.height=Math.min(a.scrollHeight,360)+'px';
  n.style.height='auto'; n.style.height=Math.min(n.scrollHeight,200)+'px';
}
// 鼠标悬停已选区块 → 在对应 textarea 高亮该段（覆盖层技术）
function highlightBlock(id){
  const el=composerMap[id]; if(!el) return;
  const isNeg = el.category==='negative';
  const ta=document.getElementById(isNeg?'assembled-neg':'assembled');
  const layer=document.getElementById(isNeg?'hl-neg':'hl-pos');
  const other=document.getElementById(isNeg?'hl-pos':'hl-neg');
  if(!ta||!layer) return;
  const txt=ta.value;
  const needle=pickEN(el);
  const escTxt=esc(txt), escNeedle=esc(needle||'');
  let html=escTxt;
  if(needle && escTxt.includes(escNeedle)){
    const i=escTxt.indexOf(escNeedle);
    html=escTxt.slice(0,i)+'<mark>'+escNeedle+'</mark>'+escTxt.slice(i+escNeedle.length);
  }
  layer.querySelector('.hl-inner').innerHTML=html;
  layer.style.display='block';
  layer.scrollTop=ta.scrollTop;
  if(other) other.style.display='none';
}
function clearHighlight(){
  ['hl-pos','hl-neg'].forEach(id=>{const l=document.getElementById(id);if(l)l.style.display='none';});
}

function openCaptureModal(){
  const root=document.getElementById('modal-root');
  root.innerHTML=`<div class="overlay" data-close="1">

      <h3>新增收藏 <small>支持 Ctrl+V 粘贴图片</small></h3>

      </div>
      <div class="field"><label>来源网址（可选）</label><input type="text" id="cap-source" style="width:100%" placeholder="https://…"></div>
      <div class="field"><label>标签（逗号分隔，可选）</label><input type="text" id="cap-tags" style="width:100%" placeholder="国风, 写实, 人像"></div>
      <div class="row" style="justify-content:flex-end">
        <button class="btn" onclick="closeModal()">取消</button>
        <button class="btn primary" id="cap-save">保存</button>
      </div>
    </div></div>`;
  const overlay=root.querySelector('.overlay');
  overlay.addEventListener('click',e=>{if(e.target.dataset.close)closeModal();});
  let pendingMedia=null;
  const prev=document.getElementById('cap-preview');
  function setMedia(blob,type,url){
    pendingMedia = url? {type,url} : {type,blob};
    prev.innerHTML = url? (type==='video'?`<video src="${url}" controls></video>`:`<img src="${url}" alt="">`)
                        : (type==='video'?`<video src="${URL.createObjectURL(blob)}" controls></video>`:`<img src="${URL.createObjectURL(blob)}" alt="">`);
  }
  document.getElementById('cap-file').addEventListener('change',e=>{const f=e.target.files[0];if(f)setMedia(f,f.type.startsWith('video')?'video':'image');});
  document.getElementById('cap-url').addEventListener('change',e=>{const u=e.target.value.trim();if(u)setMedia(null,/\.(mp4|webm|mov)$/i.test(u)?'video':'image',u);});
  overlay.addEventListener('paste',e=>{for(const it of (e.clipboardData.items||[])){if(it.type.startsWith('image/')){const f=it.getAsFile();if(f){setMedia(f,'image');toast('已粘贴图片');}break;}}});
  // 实时翻译提示词 → 写入 #cap-tr（去抖 700ms）
  async function translateCapPrompt(){
    const raw=document.getElementById('cap-prompt').value.trim();
    const box=document.getElementById('cap-tr');
    const txt=box.querySelector('.txt');
    if(!raw){ box.classList.add('loading'); txt.textContent='输入英文提示词后将自动显示中文翻译…'; box.dataset.tr=''; return; }
    box.classList.add('loading'); txt.textContent='翻译中…';
    try{
      const from=/[一-鿿]/.test(raw)?'zh':'en';
      const to=from==='zh'?'en':'zh';
      const t=await translateText(raw,from,to);
      txt.textContent=t; box.classList.remove('loading'); box.dataset.tr=t;
    }catch(e){ txt.textContent='翻译失败：'+(e.message||e); box.classList.remove('loading'); box.dataset.tr=''; }
  }
  let capTrTimer;
  document.getElementById('cap-prompt').addEventListener('input',()=>{
    clearTimeout(capTrTimer);capTrTimer=setTimeout(translateCapPrompt,700);
  });
  document.getElementById('cap-save').addEventListener('click',async()=>{
    const raw=document.getElementById('cap-prompt').value.trim();
    const source=document.getElementById('cap-source').value.trim();

    let translation=document.getElementById('cap-tr').dataset.tr || '';
    if(!translation && raw){
      try{ const f=/[一-鿿]/.test(raw)?'zh':'en'; const t=f==='zh'?'en':'zh'; translation=await translateText(raw,f,t);}catch(e){}
    }
    const cap={id:uid(),media:pendingMedia,rawPrompt:raw,translation,sourceUrl:source,tags,createdAt:Date.now(),blockCount:0};
    await putOne('captures',cap);
    closeModal();toast('已保存 ✓'+(translation?'（含译文）':''));renderCaptures();
    // 自动打开拆解
    openDecomposeModal(cap.id,raw);
  });
}

function openCatTagManager(){
  const root=document.getElementById('modal-root');
  const workCats=CATEGORIES.map(c=>({id:c.id,name:c.name,subs:[...(c.subs||[])]}));
  (async()=>{

      el.innerHTML=allTags.map(t=>`

      const oldIds=new Set(CATEGORIES.map(c=>c.id));
      const newIds=new Set(workCats.map(c=>c.id));
      const deleted=[...oldIds].filter(id=>!newIds.has(id));
      let reassigned=0, fallbackName='';
      if(deleted.length){
        const fb=workCats.find(c=>c.id==='general')||workCats[0];
        const fbId=fb?fb.id:null;
        if(fbId){
          fallbackName=catName(fbId);
          for(const b of await getAll('blocks')){
            if(deleted.includes(b.category)){ b.category=fbId; await putOne('blocks',b); reassigned++; }
          }
        }
      }
      CATEGORIES=workCats.map(c=>({id:c.id,name:c.name.trim(),subs:[...c.subs]}));
      syncSortOrder();
      await saveCategories();
      // 同步标签（重命名 / 删除）
      if(allTags.length){
        const remap=t=>{ const nv=tagMap[t]; return nv===undefined? t : nv; };
        for(const b of await getAll('blocks')){
          if(b.tags&&b.tags.length){ const nt=[...new Set(b.tags.map(remap).filter(Boolean))]; if(JSON.stringify(nt)!==JSON.stringify(b.tags)){b.tags=nt;await putOne('blocks',b);} }
        }
        for(const c of await getAll('captures')){
          if(c.tags&&c.tags.length){ const nt=[...new Set(c.tags.map(remap).filter(Boolean))]; if(JSON.stringify(nt)!==JSON.stringify(c.tags)){c.tags=nt;await putOne('captures',c);} }
        }
      }
      closeModal();
      let msg='已保存分类设置 ✓';
      if(reassigned) msg+=`（${reassigned} 个区块已移到「${fallbackName}」）`;
      toast(msg);
      renderBlocksPane(); if(state.view==='composer')renderComposer();
    });
  })();
}

/* ============ 翻译 ============ */
async function translateText(text,from,to){
  const q=encodeURIComponent(text);
  const TM=8000; // 单接口超时 8s，避免卡死
  const fetchTO=(url)=>{ const ctl=new AbortController(); const id=setTimeout(()=>ctl.abort(),TM);
    return fetch(url,{signal:ctl.signal}).finally(()=>clearTimeout(id)); };
  const errs=[];
  const tryOne=async (name,url,parse)=>{
    let r; try{ r=await fetchTO(url); }catch(e){ throw new Error(name+': '+(e.name==='AbortError'?'超时':e.message)); }
    if(!r.ok) throw new Error(name+': HTTP '+r.status);
    let j; try{ j=await r.json(); }catch(e){ throw new Error(name+': 非法 JSON'); }
    const t=parse(j);
    if(!t || /MYMEMORY WARNING/.test(t)) throw new Error(name+': 空或拒答');
    return t;
  };
  // 三个公开接口，逐个尝试，都不行就列出每家具体原因（更友好排查）
  const candidates=[
    ['googleapis','https://translate.googleapis.com/translate_a/single?client=gtx&sl='+from+'&tl='+to+'&dt=t&q='+q,
      j=>j[0]&&j[0].map(x=>x[0]).join('')],
    ['mymemory','https://api.mymemory.translated.net/get?q='+q+'&langpair='+from+'|'+to,
      j=>j.responseData&&j.responseData.translatedText],
    ['libretranslate','https://translate.argosopentech.com/translate?q='+q+'&source='+from+'&target='+to,
      j=>j&&j.translatedText]
  ];
  for(const [name,url,parse] of candidates){
    try{ return await tryOne(name,url,parse); }
    catch(e){ errs.push((e&&e.message||String(e))); }
  }
  throw new Error('所有翻译接口均不可用（可能需 VPN 或检查网络）: '+errs.join(' / '));
}
/* ============ 弹窗：拆解 ============ */
function openDecomposeModal(capId,raw){
  const root=document.getElementById('modal-root');
  root.innerHTML=`<div class="overlay" data-close="1"><div class="modal" onclick="event.stopPropagation()" style="width:min(900px,100%)">
    <h3>拆解提示词 <small>每行一个片段，指定分类后可复用</small></h3>
    <div class="field"><label>提示词全文（编辑后点「重新按行生成」）</label>
      <textarea id="dec-raw">${esc(raw)}</textarea>
      <div class="tr-preview loading" id="dec-raw-tr"><span class="lbl">🌐 全文中文翻译</span><span class="txt">翻译中…</span></div>
      <button class="btn" id="dec-gen" style="margin-top:6px">重新按行生成</button>
    </div>
    <div class="field"><label>片段列表（每行下方显示中文翻译，方便选标签）</label><div id="dec-rows"></div>
      <button class="btn" id="dec-add" style="margin-top:6px">＋ 手动加一行</button>
    </div>
    <div class="row" style="justify-content:flex-end">
      <button class="btn" onclick="closeModal()">稍后</button>
      <button class="btn primary" id="dec-save">保存区块</button>
    </div>
  </div></div>`;
  const overlay=root.querySelector('.overlay');
  overlay.addEventListener('click',e=>{if(e.target.dataset.close)closeModal();});
  const rowsEl=document.getElementById('dec-rows');
  function catOptions(sel){return CATEGORIES.map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${c.name}</option>`).join('');}
  function subOptions(catId,sel){return catSubs(catId).map(s=>`<option value="${s}" ${s===sel?'selected':''}>${s}</option>`).join('');}
  // 翻译单行片段 → 写入该行的 .dec-tr
  async function translateRow(row){
    const input=row.querySelector('.dec-content');
    const trCell=row.querySelector('.dec-tr');
    const txt=input.value.trim();
    if(!txt){ trCell.className='dec-tr empty'; trCell.textContent='（空）'; trCell.dataset.tr=''; return; }
    trCell.className='dec-tr loading'; trCell.textContent='翻译中…';
    try{
      const from=/[一-鿿]/.test(txt)?'zh':'en';
      const to=from==='zh'?'en':'zh';
      const t=await translateText(txt,from,to);
      trCell.className='dec-tr'; trCell.textContent=t; trCell.dataset.tr=t;
    }catch(e){ trCell.className='dec-tr empty'; trCell.textContent='翻译失败'; trCell.dataset.tr=''; }
  }
  // 翻译全文 → 写入 #dec-raw-tr
  async function translateRaw(){
    const raw=document.getElementById('dec-raw').value.trim();
    const box=document.getElementById('dec-raw-tr');
    const txt=box.querySelector('.txt');
    if(!raw){ box.classList.add('loading'); txt.textContent='（空）'; box.dataset.tr=''; return; }
    box.classList.add('loading'); txt.textContent='翻译中…';
    try{
      const from=/[一-鿿]/.test(raw)?'zh':'en';
      const to=from==='zh'?'en':'zh';
      const t=await translateText(raw,from,to);
      txt.textContent=t; box.classList.remove('loading'); box.dataset.tr=t;
    }catch(e){ txt.textContent='翻译失败：'+(e.message||e); box.classList.remove('loading'); box.dataset.tr=''; }
  }
  function addRow(content='',cat='booster',sub=catSubs('booster')[0],tag=''){
    const row=document.createElement('div');row.className='decomp-row';
    row.innerHTML=`<div class="decomp-cell">
        <input class="dec-content" value="${esc(content)}" placeholder="片段内容">
        <div class="dec-tr loading" data-tr="">翻译中…</div>
      </div>
      <select class="dec-cat">${catOptions(cat)}</select>
      <select class="dec-sub">${subOptions(cat,sub)}</select>
      <input class="dec-tag" value="${esc(tag)}" placeholder="标签">
      <button class="btn dec-del">✕</button>`;
    row.querySelector('.dec-cat').addEventListener('change',e=>{
      const subSel=row.querySelector('.dec-sub');subSel.innerHTML=subOptions(e.target.value,catSubs(e.target.value)[0]);});
    row.querySelector('.dec-del').addEventListener('click',()=>row.remove());
    row.querySelector('.dec-content').addEventListener('input',()=>translateRow(row));
    rowsEl.appendChild(row);
    translateRow(row);
  }
  function gen(){
    rowsEl.innerHTML='';
    const raw=document.getElementById('dec-raw').value;
    // 按逗号 / 句号（中英文）拆分
    const parts=raw.split(/[,，.。]+/).map(s=>s.trim()).filter(Boolean);
    // 自动去重（不区分大小写、忽略首尾空格）
    const seen=new Set();const uniq=[];let dup=0;
    parts.forEach(p=>{
      const key=p.toLowerCase();
      if(seen.has(key)){dup++;return;}
      seen.add(key);uniq.push(p);
    });
    uniq.forEach(l=>addRow(l));
    if(dup>0) toast(`自动去重 ${dup} 个重复片段`);
    translateRaw();
  }
  // 全文编辑时也实时翻译（去抖 600ms）
  let rawTimer;
  document.getElementById('dec-raw').addEventListener('input',()=>{
    clearTimeout(rawTimer);rawTimer=setTimeout(translateRaw,600);
  });
  document.getElementById('dec-gen').addEventListener('click',gen);
  document.getElementById('dec-add').addEventListener('click',()=>addRow());
  document.getElementById('dec-save').addEventListener('click',async()=>{
    const rows=[...rowsEl.querySelectorAll('.decomp-row')];
    let n=0;
    for(const r of rows){
      const content=r.querySelector('.dec-content').value.trim();if(!content)continue;
      const category=r.querySelector('.dec-cat').value;
      const sub=r.querySelector('.dec-sub').value;
      const tags=r.querySelector('.dec-tag').value.split(',').map(s=>s.trim()).filter(Boolean);
      // 优先用行内已翻译好的中文；如果空则现翻一次
      let translation=r.querySelector('.dec-tr')?.dataset.tr || '';
      if(!translation){
        try{ const f=/[一-鿿]/.test(content)?'zh':'en'; const t=f==='zh'?'en':'zh'; translation=await translateText(content,f,t);}catch(e){}
      }
      await putOne('blocks',{id:uid(),category,sub,content,translation,tags,sourceId:capId,usageCount:0,createdAt:Date.now()});
      n++;
    }
    const cap=await getOne('captures',capId);if(cap){cap.blockCount=(cap.blockCount||0)+n;await putOne('captures',cap);}
    closeModal();toast(`已拆出 ${n} 个区块 ✓`);
    if(state.view==='captures')renderCaptures();if(state.view==='composer')renderComposer();
  });
  gen();
  // 初始打开时，gen 内部已触发 translateRaw；再补一次保证（如果 raw 非空）
  setTimeout(translateRaw,50);
}

document.getElementById('blocks-list').addEventListener('click',async e=>{
  const src=e.target.closest('.src-link');if(src){e.stopPropagation();goToSource(src.dataset.src);return;}
  const btn=e.target.closest('button[data-act]');if(btn){e.stopPropagation();
    if(btn.dataset.act==='b-copy'){
      const b=await getOne('blocks',btn.dataset.id);if(!b)return;
      const txt=b.isCombo ? ((b.content||'')+(b.negative?'\n\nNegative: '+(b.negative):'')) : b.content;
      b.usageCount=(b.usageCount||0)+1;await putOne('blocks',b);copyText(txt);
      btn.closest('.blk-c').classList.add('added');setTimeout(()=>btn.closest('.blk-c')?.classList.remove('added'),800);
      renderBlocksPane();
    }
    if(btn.dataset.act==='b-load'){
      const b=await getOne('blocks',btn.dataset.id);if(!b)return;
      loadComposition(b);
    }
    if(btn.dataset.act==='b-del'){
      if(!confirm('确定删除这个区块？'))return;
      await delOne('blocks',btn.dataset.id);
      state.draft=state.draft.filter(x=>x!==btn.dataset.id);
      await saveDraft();
      toast('已删除');
      // 重新渲染（blocks-list 是从 composer 视图触发，state.view 必为 composer）
      if(state.view==='composer')renderComposer();
    }
    return;
  }
  const card=e.target.closest('.blk-c');if(!card)return;
  const b=await getOne('blocks',card.dataset.bid);if(!b)return;
  // combo 卡片整体点击 → 加载
  if(b.isCombo){
    loadComposition(b);
    card.classList.add('added');setTimeout(()=>card.classList.remove('added'),800);
    return;
  }
  // 普通 block → 加入 draft（按区块 id + 按内容双重去重）
  if(state.draft.includes(b.id)){
    toast('该区块已在已选区块中');
  } else {
    const newKey=pickEN(b).trim().toLowerCase();
    const dup = newKey && state.draft.some(id=>{
      const ob=composerMap[id];
      return ob && pickEN(ob).trim().toLowerCase()===newKey;
    });
    if(dup){
      toast('该片段内容已存在于已选区块中，不重复添加');
    } else {
      state.draft.push(b.id);
      b.usageCount=(b.usageCount||0)+1;
      await putOne('blocks',b);await saveDraft();
      card.classList.add('added');setTimeout(()=>card.classList.remove('added'),800);
    }
  }
  renderComposer();
});

// assetPresets.subtypes 仅作**创建新集时**的初始参考（一次性，不会回写）。
// 集封面：显式封面 > 上传封面图 > 与子资产显示模式联动（色板集专属）
function collectionCover(name, assets){
  const root=assets.find(a=>a.name===name && !a.parent); if(!root) return '';
  const mku=im=>{ if(!im) return ''; const u=im.blob?URL.createObjectURL(im.blob):(im.url||''); if(u) assetMediaUrls.push(u); return u; };
  if(root.category==='chengpian'){
    const child=assets.find(a=>(a.parent||'')===name && a.video);
    if(child) return mku(child.video);
  }
  if(root.cover) return mku(root.cover);
  if(root.images&&root.images.length) return mku(root.images[0]);
  // 色板集：与「内部显示」联动——若第一个子资产切到了「图片」模式，外面封面就用它的图片；
  // 否则渲染集本身的色板条（与集内子资产默认的色板显示保持一致）。
  if(root.category==='palette'){
    const children=assets.filter(a=>a.parent===name).sort((a,b)=>b.createdAt-a.createdAt);
    const first=children[0];
    if(first && first.images && first.images.length && (first.thumbMode||'palette')==='image'){
      return mku(first.images[0]);
    }
    if(root.detail && root.detail.colors && root.detail.colors.length){
      return paletteSvgUrl(root.detail.colors);
    }
  }
  const ch=assets.find(a=>a.parent===name && a.images && a.images.length);
  if(ch) return mku(ch.images[0]);
  return '';
}
/* 色板条 → SVG data URL（用作 img src，外部封面用） */
function paletteSvgUrl(colors){
  if(!colors||!colors.length) return '';
  const w=420, h=240, gap=2;
  const n=colors.length;
  const totalGap=gap*(n-1);
  const rectW=(w-totalGap)/n;
  const rects=colors.map((c,i)=>{
    const x=i*(rectW+gap);
    return `<rect x="${x.toFixed(1)}" y="0" width="${rectW.toFixed(1)}" height="${h}" fill="${esc(c.hex)}"/>`;
  }).join('');
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid slice">${rects}</svg>`;
  return 'data:image/svg+xml;utf8,'+encodeURIComponent(svg);
}

function assetThumbHtml(a){

    return `<div class="m-thumb prompt-thumb" style="padding:10px;background:var(--bg2);align-items:flex-start;justify-content:flex-start;overflow:hidden">${preview}</div>`;
  }
  // 色板资产：可按 thumbMode 在「色板条」与「上传图片」之间切换显示封面
  if(a.category==='palette' && (a.thumbMode||'palette')!=='image'){

async function renderAssets(){
  revokeAssetMedia();
  renderAssetCatTabs();
  const grid=document.getElementById('asset-grid');
  const crumb=document.getElementById('asset-crumb');
  let assets=await getAll('assets');
  if(state.assetProject) assets=assets.filter(a=>a.projectId===state.assetProject);
  const q=(document.getElementById('asset-search').value||'').toLowerCase();

  // ===== 集内视图：画板式紧凑展示 + 小类导航条 + 拖拽排序 =====
  if(state.assetCollection){
    const root=assets.find(a=>a.name===state.assetCollection && !a.parent);
    const parentCategory=root?root.category:'';
    crumb.hidden=false;
    document.getElementById('asset-add').textContent='＋ 新建资产';
    crumb.innerHTML=`<button class="btn" id="crumb-back">← 全部集</button><span class="crumb-name">${esc(state.assetCollection)}</span>`;
    let children=assets.filter(a=>(a.parent||'')===state.assetCollection);
    if(q) children=children.filter(a=>(a.name+' '+(a.purpose||'')+' '+((a.tags||[]).join(' '))).toLowerCase().includes(q));
    // 排序：自定义顺序（拖拽后的 order 字段）→ 颜色 → 名字 → 时间
    const sortBy=state.assetSort||'order';
    children.sort((a,b)=>{
      if(sortBy==='order'){
        const oa=a.order||0, ob=b.order||0;
        if(oa!==ob) return ob-oa; // 新的在前
        return b.createdAt-a.createdAt;
      }
      if(sortBy==='name') return (a.name||'').localeCompare(b.name||'','zh');
      if(sortBy==='color') return subTypeColor(a.subType||'').localeCompare(subTypeColor(b.subType||''));
      return b.createdAt-a.createdAt;
    });
    // 小类导航条：收集当前集用过的所有 subType + 颜色，按使用次数排序
    const subFreq={}; children.forEach(c=>{ if(c.subType) subFreq[c.subType]=(subFreq[c.subType]||0)+1; });
    const subs=Object.keys(subFreq).sort((a,b)=>subFreq[b]-subFreq[a]);
    let navHtml='<div class="subtype-nav">';
    navHtml+=`<span class="nav-title">小类</span>`;
    navHtml+=subs.map(s=>{
      const col=subTypeColor(s);
      return `<span class="sub-chip" data-sub="${esc(s)}"><span class="dot" style="background:${col}"></span>${esc(s)} <span style="opacity:.6;font-size:10px">(${subFreq[s]})</span></span>`;
    }).join('');
    navHtml+=`<select class="sort-sel" id="asset-sort-sel" title="排序方式"><option value="order" ${sortBy==='order'?'selected':''}>↕ 自定义（拖拽）</option><option value="time" ${sortBy==='time'?'selected':''}>⏱ 时间</option><option value="name" ${sortBy==='name'?'selected':''}>A 按名字</option><option value="color" ${sortBy==='color'?'selected':''}>🎨 按颜色</option></select>`;
    navHtml+='</div>';
    let html=`<div class="set-label">子资产（${children.length} 个）</div>${navHtml}`;
    if(!children.length){
      html+=`<div class="empty">这个集里还没有子资产。点「＋ 新建资产」，它会自动归入「${esc(state.assetCollection)}」。</div>`;
    } else {
      html+=`<div class="list-grid" id="mood-grid">${children.map(a=>moodRowHtml(a,{inCollection:true,parentCategory})).join('')}</div>`;
    }
    grid.className='';
    grid.innerHTML=html;
    document.getElementById('crumb-back').addEventListener('click',()=>{state.assetCollection='';renderAssetCatTabs();renderAssets();});
    // 排序下拉
    const sortSel=document.getElementById('asset-sort-sel');
    if(sortSel) sortSel.addEventListener('change',e=>{state.assetSort=e.target.value;renderAssets();});
    // 拖拽排序（仅「order」排序时启用）
    if(sortBy==='order') attachDragSort();
    return;
  }

  // ===== 集总览：根资产以封面卡片展示 =====
  crumb.hidden=true;
  document.getElementById('asset-add').textContent='＋ 新建集';
  let roots=assets.filter(a=>!a.parent);
  if(state.assetCat!=='all') roots=roots.filter(a=>a.category===state.assetCat);
  if(q) roots=roots.filter(a=>(a.name+' '+(a.purpose||'')+' '+((a.tags||[]).join(' '))).toLowerCase().includes(q));
  roots.sort((a,b)=>b.createdAt-a.createdAt);
  const childCount={}; assets.forEach(a=>{if(a.parent)childCount[a.parent]=(childCount[a.parent]||0)+1;});
  document.getElementById('asset-count').textContent=`共 ${roots.length} 个集 / 全部资产 ${assets.length} 个`;
  if(!roots.length){
    grid.className='';
    grid.innerHTML=`<div class="empty">还没有任何「集」。先点「＋ 新建集」创建人物 / 场景 / 道具，再在它下面挂子资产（三视图、配饰、多角度…）。<br><span class="meta">提示：进入一个集后，新建的资产会自动归入该集。</span></div>`;
    return;
  }
  grid.className='grid mood-grid';
  grid.innerHTML=roots.map(a=>collectionCardHtml(a,childCount, collectionCover(a.name, assets))).join('');
}
/* HTML5 拖拽排序：把 list-grid 内行按拖动后的顺序写回 order 字段（拖到前面 = 较大 order） */
function attachDragSort(){
  const grid=document.getElementById('mood-grid'); if(!grid) return;
  const cards=[...grid.querySelectorAll('.asset-row')];
  let dragId=null;
  cards.forEach(c=>{
    c.addEventListener('dragstart',e=>{
      dragId=c.dataset.aid;
      c.classList.add('dragging');
      e.dataTransfer.effectAllowed='move';
      try{ e.dataTransfer.setData('text/plain', dragId); }catch(_){}
    });
    c.addEventListener('dragend',()=>{ c.classList.remove('dragging'); cards.forEach(x=>x.classList.remove('drag-over')); dragId=null; });
    c.addEventListener('dragover',e=>{ e.preventDefault(); if(dragId && c.dataset.aid!==dragId) c.classList.add('drag-over'); });
    c.addEventListener('dragleave',()=>c.classList.remove('drag-over'));
    c.addEventListener('drop',async e=>{
      e.preventDefault(); c.classList.remove('drag-over');
      if(!dragId || c.dataset.aid===dragId) return;
      // 把 dragId 的行移到 c 之前
      const src=grid.querySelector(`.asset-row[data-aid="${dragId}"]`);
      if(src && c && src!==c){ grid.insertBefore(src, c); }
      // 收集 DOM 顺序，重写 order（越大越前）
      const ids=[...grid.querySelectorAll('.asset-row')].map(x=>x.dataset.aid);
      try{
        for(let i=0;i<ids.length;i++){
          const a=await getOne('assets',ids[i]); if(a){ a.order=ids.length-i; await putOne('assets',a); }
        }
      }catch(err){ console.warn('persist order failed',err); }
      toast('已更新排序 ✓');
    });
  });
}

  function renderTagSuggestions(){

  /* 调用标注字段：从已有资产 callout 历史提取建议 */
  function renderCalloutQuickChips(){
    const c=document.getElementById('am-callout-sugs'); if(!c) return;
    // 取该父集分类下所有资产的 callout，去重取最近 12 条

    for(const x of allC){
      // 同分类下：找最新顺序
      if(list.length>=12) break;

  /* 子类型数据源：当前所属集根资产的 subTypes[] + 该集下子资产历史。
     注意：集内外完全独立——同一个「人物」分类下，不同集可各自管理子类型预设，
     不再受 assetPresets.subtypes[category] 全局预设绑定。 */
  function getCollectionSubTypes(){
    if(!a.parent) return {root:null, list:[], merged:[]};
    const root = allAssets.find(x=>x.name===a.parent && !x.parent);
    if(!root) return {root:null, list:[], merged:[]};
    root.subTypes = root.subTypes || [];
    // 集内子资产历史（按 createdAt 倒序去重）
    const seen = new Set(root.subTypes);
    const hist = [];
    allAssets.filter(x=>x.parent===a.parent && x.subType).sort((a,b)=>b.createdAt-a.createdAt).forEach(x=>{
      if(!seen.has(x.subType)){ seen.add(x.subType); hist.push(x.subType); }
    });
    return { root, list:root.subTypes, merged:[...root.subTypes, ...hist] };
  }
  function renderSubtypeHistory(){
    const c=document.getElementById('am-sub-history'); if(!c) return;
    const { root, merged } = getCollectionSubTypes();
    if(!root){ c.innerHTML='<span class="meta">先在某个集里创建资产时才能添加子类型。</span>'; return; }
    if(!merged.length){ c.innerHTML='<span class="meta">还没有子类型，点下方输入框新增。</span>'; return; }
    const cur=(document.getElementById('am-subtype')||{}).value||'';
    c.innerHTML=merged.map(v=>{
      const col=subTypeColor(v);
      const on=v===cur;
      return `<span class="sug-chip ${on?'on':''}" data-v="${esc(v)}" style="color:${col};border-color:${col}"><span class="dot" style="width:7px;height:7px;border-radius:50%;background:${col};display:inline-block;margin-right:4px"></span>${esc(v)}<button class="chip-x" data-x="${esc(v)}" title="从该集的子类型中移除">✕</button></span>`;
    }).join('');
    c.querySelectorAll('.sug-chip').forEach(ch=>{
      ch.addEventListener('click',e=>{
        if(e.target.classList.contains('chip-x')) return;
        const inp=document.getElementById('am-subtype'); if(inp){ inp.value=ch.dataset.v; renderSubtypeHistory(); }
      });
    });
    c.querySelectorAll('.chip-x').forEach(x=>x.addEventListener('click',async e=>{
      e.stopPropagation();
      const v=x.dataset.x;
      const cur = getCollectionSubTypes();
      if(cur.root){
        cur.root.subTypes = cur.root.subTypes.filter(t=>t!==v);
        await putOne('assets', cur.root);
        renderSubtypeHistory();
      }
    }));
    // 新增子类型回车 → 写入到根资产的 subTypes[]，与集绑定
    const addInp=document.getElementById('am-sub-add');
    if(addInp && !addInp._wired){
      addInp._wired=true;
      addInp.addEventListener('keydown',async e=>{
        if(e.key==='Enter'){
          e.preventDefault();
          const v=addInp.value.trim(); if(!v) return;
          const cur = getCollectionSubTypes();
          if(cur.root){
            cur.root.subTypes = cur.root.subTypes || [];
            if(!cur.root.subTypes.includes(v)) cur.root.subTypes.push(v);
            await putOne('assets', cur.root);
          }
          document.getElementById('am-subtype').value=v;
          addInp.value=''; renderSubtypeHistory();
        }
      });
    }
  }
  function refreshSuggestions(){
    const cat=getCat();

    // 只有创建新集时才退化为全局默认同类为初始候选（一次性，不会回写全局）。
    try{
      let subList;

        subList = getCollectionSubTypes().merged;

        const curRoot = allAssets.find(x=>x.id===a.id);
        subList = (curRoot&&curRoot.subTypes||[]).slice();
      } else {
        subList = assetPresets.subtypes[cat]||[];
      }
      fillDatalist('am-subtype-list', subList);
    }catch(_){}
    if(document.getElementById('am-parent-list')) fillDatalist('am-parent-list',assetCharNames);
    renderTagSuggestions();
    renderPurposeSuggestions();
    renderToolQuickChips();
    renderNameQuickChips();
    renderCalloutQuickChips();

  // 封面选择器：从集内子资产图片中挑选一张做封面

  function renderDetail(){

    if(cat==='palette'){
      if(!a.detail.colors||!a.detail.colors.length) a.detail.colors=defaultPaletteColors();

      let needTranslate=false, trFrom='', trTo='';
      if(!isCollection && parentCategory==='prompt' && a.genPrompt){
        try{
          trFrom=/[一-鿿]/.test(a.genPrompt)?'zh':'en';
          trTo=trFrom==='zh'?'en':'zh';
          a.genPromptLang=trFrom; a.genPromptTr='';
          needTranslate=true;
        }catch(_){}
      }
      await putOne('assets',a);
      if(!isCollection && a.tool && !assetPresets.tools.includes(a.tool)){assetPresets.tools.push(a.tool);}
      (a.tags||[]).forEach(t=>{if(t && !assetPresets.tags.includes(t))assetPresets.tags.push(t);});
      // 子类型：把当前子类型并入根资产 subTypes（与所在集绑定，不再写入全局预选项）
      if(!isCollection && a.subType && a.parent){
        const rootAsset = (await getAll('assets')).find(x=>x.name===a.parent && !x.parent);
        if(rootAsset){
          rootAsset.subTypes = rootAsset.subTypes || [];
          if(!rootAsset.subTypes.includes(a.subType)) rootAsset.subTypes.push(a.subType);
          await putOne('assets', rootAsset);
        }
      }
      await saveAssetPresets();
      const willTranslate = needTranslate;
      closeModal();
      toast(willTranslate ? '已保存 + 翻译中…' : (isEdit?'已保存修改 ✓':'已创建'+(isCollection?'集 ✓':'资产 ✓')));
      renderAssets();populateAssetParents();
      // 提示词资产：保存后异步翻译（中文→英文 / 英文→中文），译文写回 genPromptTr
      if(willTranslate){
        translateText(a.genPrompt, trFrom, trTo).then(async tr=>{
          try{
            const fresh=await getOne('assets',a.id); if(!fresh) return;
            fresh.genPromptTr=tr; await putOne('assets',fresh);
            if(state.assetCollection) renderAssets();
            toast('已自动翻译 ✓');
          }catch(_){}
        }).catch(err=>{ toast('翻译失败：'+(err&&err.message||'请检查网络')); });
      }
    }catch(err){ console.error('save asset failed:',err); toast('保存失败：'+(err&&err.message||err)); }
  });
}

function openAssetCatEditor(){
  const root=document.getElementById('modal-root');
  const render=()=>{

      <div class="mtab" style="overflow-y:auto;padding-right:6px">
        ${ASSET_CATS.map((c,i)=>`
          <div class="cat-edit-row" data-i="${i}">
            <input class="cat-icon" value="${esc(c.icon||'📁')}" maxlength="2" style="width:42px;text-align:center;font-size:18px">
            <input class="cat-name" value="${esc(c.name)}" placeholder="分类名称" style="flex:1">
            <button class="btn mini" data-act="up" ${i===0?'disabled':''}>↑</button>
            <button class="btn mini" data-act="down" ${i===ASSET_CATS.length-1?'disabled':''}>↓</button>
            <button class="btn mini danger" data-act="del">✕</button>
          </div>`).join('')}
        <button class="btn" id="ac-add" style="margin-top:10px">＋ 添加分类</button>
      </div>
      <div class="row" style="justify-content:flex-end;margin-top:10px">
        <button class="btn" onclick="closeModal()">取消</button>
        <button class="btn primary" id="ac-save">保存</button>
      </div>
    </div></div>`;
    root.querySelector('.overlay').addEventListener('click',e=>{if(e.target.dataset.close)closeModal();});
    root.querySelectorAll('.cat-edit-row').forEach(row=>{
      const i=+row.dataset.i;
      row.querySelector('.cat-name').addEventListener('input',e=>ASSET_CATS[i].name=e.target.value);
      row.querySelector('.cat-icon').addEventListener('input',e=>ASSET_CATS[i].icon=e.target.value);
      row.querySelector('[data-act="up"]').addEventListener('click',()=>{if(i>0){[ASSET_CATS[i-1],ASSET_CATS[i]]=[ASSET_CATS[i],ASSET_CATS[i-1]];render();}});
      row.querySelector('[data-act="down"]').addEventListener('click',()=>{if(i<ASSET_CATS.length-1){[ASSET_CATS[i+1],ASSET_CATS[i]]=[ASSET_CATS[i],ASSET_CATS[i+1]];render();}});
      row.querySelector('[data-act="del"]').addEventListener('click',async()=>{
        const cat=ASSET_CATS[i];
        const all=await getAll('assets');
        const n=all.filter(a=>a.category===cat.id).length;
        if(n>0){ toast('无法删除「'+cat.name+'」：有 '+n+' 个资产属于该分类，请先处理这些资产'); return; }
        ASSET_CATS.splice(i,1);render();
      });
    });
    root.querySelector('#ac-add').addEventListener('click',()=>{
      ASSET_CATS.push({id:'cat_'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:'新分类',icon:'📁',parent:'',hint:''});
      render();
    });
    root.querySelector('#ac-save').addEventListener('click',async()=>{
      if(ASSET_CATS.some(c=>!c.name.trim())){toast('分类名称不能为空');return;}
      await saveAssetCats();
      renderAssetCatTabs();renderAssets();populateAssetParents();
      closeModal();toast('已保存集分类 ✓');
    });
  };
  render();
}

document.getElementById('asset-del-project').addEventListener('click',async()=>{

  const projects=await getAll('projects'); const p=projects.find(x=>x.id===id);
  if(!p){ toast('项目不存在'); return; }
  // 级联删除：项目下所有资产 + 若是「集（根）」其下子资产

  const ownChildren=all.filter(x=>x.parent && rootNames.has(x.parent));
  const toDelSet=new Set([...ownAssets.map(x=>x.id), ...ownChildren.map(x=>x.id)]);
  const totalCount=toDelSet.size;

/* ============ 整库备份 / 导入合并（按 id 并集去重） ============ */
// 导出：把对象里的 Blob 递归转成 dataUrl，便于塞进单个 JSON
async function blobFieldsToDataUrl(v){
  if(v instanceof Blob) return await blobToDataURL(v);
  if(Array.isArray(v)) return await Promise.all(v.map(blobFieldsToDataUrl));
  if(v && typeof v==='object'){
    const out={};
    for(const k of Object.keys(v)){
      const val=v[k];
      if(val instanceof Blob) out[k]=await blobToDataURL(val);
      else if(val && typeof val==='object') out[k]=await blobFieldsToDataUrl(val);
      else out[k]=val;
    }
    return out;
  }
  return v;
}
// 导入：把 dataUrl 递归还原成 Blob（video / images 等）
async function reviveDataUrls(v){
  if(v && typeof v==='object'){
    if(Array.isArray(v)) return await Promise.all(v.map(reviveDataUrls));
    const out={};
    for(const k of Object.keys(v)){
      const val=v[k];
      if(k==='dataUrl' && typeof val==='string' && val.startsWith('data:')){
        out.blob=await dataURLToBlob(val);
      } else if(val && typeof val==='object'){
        out[k]=await reviveDataUrls(val);
      } else out[k]=val;
    }
    return out;
  }
  return v;
}
// 按 id 并集合并：相同 id 跳过（保留现有、不覆盖），新 id 追加
async function mergeStoreById(name, incoming){
  const existing=await getAll(name);
  const exIds=new Set(existing.map(x=>x.id));
  let added=0,skipped=0;
  for(const item of incoming||[]){
    if(!item || item.id===undefined || item.id===null) continue;
    if(exIds.has(item.id)){ skipped++; continue; }
    await putOne(name, await reviveDataUrls(item));
    added++;
  }
  return {added,skipped};
}
function deepMergePresets(a,b){
  if(Array.isArray(b)) return [...new Set([...(Array.isArray(a)?a:[]), ...b])];
  const out=(a&&typeof a==='object')?{...a}:{};
  for(const k of Object.keys(b||{})){
    const bv=b[k];
    if(Array.isArray(bv)){
      const av=Array.isArray(out[k])?out[k]:[];
      out[k]=[...new Set([...av, ...bv])];
    } else if(bv && typeof bv==='object' && !Array.isArray(bv)){
      out[k]=deepMergePresets(out[k]||{}, bv);
    } else out[k]=bv;
  }
  return out;
}
async function mergeMetaStores(metaIn){
  for(const [key,val] of Object.entries(metaIn||{})){
    if(key==='assetCats'){
      const ex=(await getOne('meta',key))?.value||[];
      const byId=new Map();
      [...ex, ...(Array.isArray(val)?val:[])].forEach(c=>{ if(c&&c.id) byId.set(c.id,c); });
      await putOne('meta',{id:key,value:[...byId.values()]});
    } else if(key==='assetPresets'){
      const ex=(await getOne('meta',key))?.value||{};
      await putOne('meta',{id:key,value:deepMergePresets(ex, val||{})});
    } else {
      await putOne('meta',{id:key,value:val});
    }
  }
  await loadAssetCats(); await loadAssetPresets();
}
document.getElementById('asset-backup').addEventListener('click',async()=>{
  try{
    const stores=['captures','blocks','meta','assets','projects'];
    const dump={app:'prompt-vault',version:APP_VER,exportedAt:Date.now(),stores:{}};
    for(const s of stores){
      const rows=await getAll(s);
      dump.stores[s]= await Promise.all(rows.map(async r=> await blobFieldsToDataUrl(r)));
    }
    const blob=new Blob([JSON.stringify(dump)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='vault-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();
    toast('已导出整库备份 ✓');
  }catch(e){ console.error(e); toast('导出失败：'+(e&&e.message||e)); }
});
document.getElementById('asset-restore').addEventListener('click',()=>document.getElementById('asset-restore-file').click());
document.getElementById('asset-restore-file').addEventListener('change',async e=>{
  const f=e.target.files[0]; if(!f) return;
  e.target.value='';
  if(!confirm('导入将与现有数据「按 id 并集去重合并」：\n· 相同 id 的保留现有、不覆盖；\n· 新的 id 追加；\n· 不会删除你已有的任何资产。\n（例如：家/公司各增资产，合并后两边都会是全集）\n确定继续？')) return;
  try{
    const data=JSON.parse(await f.text());
    const stores=data.stores||{};
    let totalAdded=0,totalSkip=0;
    for(const s of ['captures','blocks','assets','projects']){
      if(!stores[s]) continue;
      const {added,skipped}=await mergeStoreById(s, stores[s]);
      totalAdded+=added; totalSkip+=skipped;
    }
    if(stores.meta) await mergeMetaStores(stores.meta);
    toast(`导入完成 ✓ 新增 ${totalAdded} 条，已有跳过 ${totalSkip} 条（去重）`);
    renderAssets(); populateProjects(); populateAssetParents();
  }catch(e){ console.error(e); toast('导入失败：'+(e&&e.message||e)); }
});

/* 被其他标签页占用时，弹一条可重试的提示条，而不是让整个应用死掉 */
function showBlockedBanner(){
  let b=document.getElementById('db-blocked');
  if(!b){
    b=document.createElement('div'); b.id='db-blocked';
    b.style.cssText='position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:9999;background:#2a1320;border:1px solid #ff4d6d;color:#ffd9e2;padding:12px 16px;border-radius:10px;max-width:92%;box-shadow:0 6px 24px rgba(0,0,0,.5);font-size:13px;line-height:1.55';
    document.body.appendChild(b);
  }
  b.innerHTML='⚠️ 数据库被其他打开的本页面标签页占用，导致无法加载数据。<br>请<b>关闭其他本页面的标签页</b>后点此重试：<button id="db-retry" style="margin-left:8px;padding:3px 12px;border:1px solid #ff5c8a;background:#ff5c8a;color:#1a1a1f;border-radius:6px;cursor:pointer">重试</button>';
  b.querySelector('#db-retry').onclick=async()=>{
    b.innerHTML='正在重试…';
    try{ await reopenDB(); await initApp(); b.remove(); }
    catch(e){ showBlockedBanner(); }
  };
}
// 清理孤儿子资产：父集（根资产）已被删除、但子资产仍残留的情况。
// 这类孤儿会导致「重名新建集」时自动认回旧图。每次启动自动清一次。
async function cleanupOrphanAssets(){
  try{
    const all=await getAll('assets');
    const rootNames=new Set(all.filter(a=>!a.parent).map(a=>a.name));
    const orphans=all.filter(a=>a.parent && !rootNames.has(a.parent));
    if(orphans.length){
      for(const o of orphans) await delOne('assets',o.id);
      console.log('[VaultStudio] 已清理 '+orphans.length+' 个孤儿子资产');
    }
  }catch(e){ console.warn('cleanupOrphanAssets failed',e); }
}
async function initApp(){
  await loadCategories();
  const d=await getOne('meta','draft');state.draft=(d&&d.value)||[];
  await seedIfEmpty();
  await seedAssetsIfEmpty();
  await cleanupOrphanAssets(); // 修好历史上已残留的孤儿（如曾删过又重建的同名集）
  await loadAssetPresets();
  await loadAssetCats(); // 加载可编辑的集分类（meta.assetCats），必须在 renderAssetCatTabs 前
  await populateProjects();
  renderAssetCatTabs();
  setView('captures');
}
async function boot(){
  try{
    await openDB();
    await initApp();
  }catch(err){
    console.error('初始化失败：',err);
    if(err && err.message==='DB_BLOCKED'){ showBlockedBanner(); }
    else { toast('初始化失败：'+((err&&err.message)||err)+'（如持续失败，可关闭其他本页面标签页后硬刷新，不要清除站点数据）'); }
  }
}
boot();
